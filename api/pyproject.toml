[project]
name = "llm-guard-api"
version = "0.1.0"
description = "Centralized ingest + query API for LLM Guard extension telemetry."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "python-jose[cryptography]>=3.3",
  "httpx>=0.27",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000

[tool.pytest.ini_options]
asyncio_mode = "auto"
