<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Guard</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="header">
      <span class="brand">
        <svg
          class="shield"
          viewBox="0 0 24 24"
          width="22"
          height="22"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"
          />
          <path
            fill="#fff"
            d="m10.6 14.6-2.3-2.3 1.1-1.1 1.2 1.2 3.3-3.3 1.1 1.1-4.4 4.4Z"
          />
        </svg>
        <h1 class="title">LLM Guard</h1>
      </span>
      <label class="switch" title="Enable protection">
        <input type="checkbox" id="enabled" aria-label="Enable protection" />
        <span class="track" aria-hidden="true"></span>
      </label>
    </header>

    <main>
      <section class="reveal" aria-label="Reveal anonymized values">
        <button type="button" id="reveal-toggle" class="reveal-btn">
          Reveal real values
        </button>
        <p class="reveal-hint" id="reveal-hint">
          Behavior is set by your organization's rules.
        </p>
      </section>

      <section class="activity" aria-label="Recent activity">
        <h2 class="section-title">Recent activity</h2>
        <ul id="activity" class="activity-list"></ul>
      </section>
    </main>

    <footer class="footer">
      <button type="button" id="open-options" class="link-btn">
        Advanced settings
      </button>
    </footer>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
