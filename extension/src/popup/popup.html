<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AvoPseudo</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="header">
      <span class="brand">
        <svg
          class="shield"
          viewBox="0 0 24 24"
          width="22"
          height="22"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"
          />
          <path
            fill="#fff"
            d="M8.3 6.3h7.4a.7.7 0 0 1 0 1.4H8.3a.7.7 0 0 1 0-1.4ZM8.3 14.8h7.4a.7.7 0 0 1 0 1.4H8.3a.7.7 0 0 1 0-1.4ZM8.7 8.5h6.6L12 11.4ZM8.7 14.2h6.6L12 11.4ZM11.5 10.9h1v1.6h-1Z"
          />
        </svg>
        <h1 class="title">AvoPseudo</h1>
      </span>
      <label class="switch" title="Enable protection">
        <input type="checkbox" id="enabled" aria-label="Enable protection" />
        <span class="track" aria-hidden="true"></span>
      </label>
    </header>

    <main>
      <section class="how" aria-label="How AvoPseudo protects you">
        <p class="how-text">
          Text you <strong>paste</strong> into a chat box is pseudonymised on
          the spot. Tags like <code class="how-tag">[NAME_1a2b]</code> are
          written by AvoPseudo — never by you or the AI.
        </p>
      </section>

      <section class="reveal" aria-label="Reveal anonymized values">
        <button type="button" id="reveal-toggle" class="reveal-btn">
          Reveal real values
        </button>
        <p class="reveal-hint" id="reveal-hint">
          Swaps AvoPseudo's tags back to the real values, in this page only.
        </p>
      </section>

      <section class="activity" aria-label="Recent activity">
        <h2 class="section-title">Recent activity</h2>
        <ul id="activity" class="activity-list"></ul>
      </section>
    </main>

    <footer class="footer">
      <button type="button" id="open-options" class="link-btn">
        Advanced settings
      </button>
    </footer>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
