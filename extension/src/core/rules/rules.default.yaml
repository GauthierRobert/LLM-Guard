      - "strategie juridique"
      - "strategie de negociation"
      - "note de plaidoirie"
      - "projet de conclusions"
      - "proposition transactionnelle"
      - "confidentiel avocat"
      - "correspondance entre avocats"

  - id: business-confidential
    description: Secrets d'affaires et informations non publiques
    kind: words
    action: warn
    severity: high
    words:
      - "strictement confidentiel"
      - "ne pas diffuser"
      - "secret des affaires"
