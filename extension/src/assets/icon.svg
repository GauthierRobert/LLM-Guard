<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AvoPseudo">
  <defs>
    <!-- Shield body: teal-green → deep green (from logo palette #0E9E85 / #0C342B) -->
    <linearGradient id="shield" x1="24" y1="8" x2="104" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14B89C"/>
      <stop offset="0.5" stop-color="#0E9E85"/>
      <stop offset="1" stop-color="#0C342B"/>
    </linearGradient>
    <!-- Top glossy highlight -->
    <linearGradient id="gloss" x1="64" y1="8" x2="64" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft drop shadow -->
    <filter id="ds" x="-20%" y="-12%" width="140%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#072017" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Shield outline -->
  <path filter="url(#ds)" d="M64 8 L108 24 V62 C108 92 89 112 64 122 C39 112 20 92 20 62 V24 Z"
        fill="url(#shield)"/>

  <!-- Inner rim -->
  <path d="M64 16 L100 29 V62 C100 87 84.5 104.5 64 113.5 C43.5 104.5 28 87 28 62 V29 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2.5"/>

  <!-- Gloss on the upper half -->
  <path d="M64 8 L108 24 V60 C90 50 74 47 64 47 C54 47 38 50 20 60 V24 Z" fill="url(#gloss)"/>

  <!-- ===== Hourglass logo ===== -->
  <!-- Top & bottom bars (solid teal, rounded) -->
  <rect x="42" y="33" width="44" height="8" rx="4" fill="#0E9E85"/>
  <rect x="42" y="85" width="44" height="8" rx="4" fill="#0E9E85"/>

  <!-- Bowtie / hourglass: white-outlined teal triangles meeting at the neck -->
  <g fill="#0E9E85" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
    <path d="M44 46 L84 46 L64 63 Z"/>
    <path d="M44 80 L84 80 L64 63 Z"/>
  </g>

  <!-- Center neck (the falling sand) -->
  <rect x="61" y="58" width="6" height="12" rx="3" fill="#0E9E85" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
