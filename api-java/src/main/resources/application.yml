server:
  port: 8000
  forward-headers-strategy: framework

spring:
  application:
    name: llm-guard-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/llmguard}
    username: ${DATABASE_USER:llmguard}
    password: ${DATABASE_PASSWORD:llmguard}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuer; may be blank in dev to disable JWT validation.
          issuer-uri: ${KEYCLOAK_ISSUER:}

llmguard:
  org-id: ${ORG_ID:default}
  device-token-secret: ${DEVICE_TOKEN_SECRET:change-me-in-prod}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  keycloak-audience: ${KEYCLOAK_AUDIENCE:llm-guard-dashboard}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
