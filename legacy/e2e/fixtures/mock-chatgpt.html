<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock ChatGPT</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 24px; max-width: 720px; }
      textarea { width: 100%; height: 120px; font-family: monospace; }
      button { padding: 8px 16px; margin-top: 8px; }
      #response { margin-top: 16px; padding: 12px; border: 1px solid #ccc; min-height: 60px; white-space: pre-wrap; }
      #status { margin-top: 8px; color: #666; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Mock ChatGPT (Playwright fixture)</h1>
    <p>This page mimics chatgpt.com's wire format so LLM Guard's content script
       activates and intercepts the fetch.</p>

    <textarea id="prompt-textarea" placeholder="Type a prompt..."></textarea>
    <button id="send">Send</button>
    <div id="status">idle</div>
    <div id="response" data-testid="response"></div>

    <script>
      const promptEl = document.getElementById("prompt-textarea");
      const sendBtn = document.getElementById("send");
      const responseEl = document.getElementById("response");
      const statusEl = document.getElementById("status");

      // Expose last sent body for tests (set after the route receives it,
      // populated via __lastBody from the page side too).
      window.__llmGuardE2E = { lastBody: null, lastResponseText: null, lastError: null };

      sendBtn.addEventListener("click", async () => {
        statusEl.textContent = "sending...";
        responseEl.textContent = "";
        window.__llmGuardE2E.lastError = null;

        // Build a body matching the chatgpt adapter: messages[].content.parts[].
        const body = JSON.stringify({
          action: "next",
          messages: [
            {
              id: "msg-" + Date.now(),
              author: { role: "user" },
              content: { content_type: "text", parts: [promptEl.value] },
            },
          ],
          model: "gpt-4o",
        });

        // Mirror the body the *page* tried to send (pre-extension). The
        // extension monkey-patches fetch in MAIN world, so init.body that
        // reaches the network is what we really want — that comes from the
        // route handler in the test, not from here.
        window.__llmGuardE2E.lastBody = body;

        try {
          const resp = await fetch("/backend-api/conversation", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body,
          });
          if (!resp.ok) {
            statusEl.textContent = "blocked status=" + resp.status;
            const t = await resp.text();
            window.__llmGuardE2E.lastResponseText = t;
            responseEl.textContent = t;
            return;
          }
          const text = await resp.text();
          window.__llmGuardE2E.lastResponseText = text;
          responseEl.textContent = text;
          statusEl.textContent = "done";
        } catch (err) {
          window.__llmGuardE2E.lastError = String(err);
          statusEl.textContent = "error: " + err.message;
        }
      });
    </script>
  </body>
</html>
