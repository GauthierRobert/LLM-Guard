name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  extension:
    name: Extension — tests + lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dev tooling
        run: npm install --no-save eslint@^8.57.0 prettier@^3.2.5
      - name: Build generated config
        run: node build.js
      - name: Run unit tests
        run: npm test
      - name: ESLint
        run: npx eslint . --ext .js
      - name: Prettier (check only)
        run: npx prettier --check "**/*.{js,json,md}"

  backend:
    name: Java backend — Gradle build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build + test
        run: ./gradlew build --no-daemon

  dashboard:
    name: Angular dashboard — type check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npx ng build --configuration=production
