<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>LLM Guard — Configuration</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0e0f11; color: #d1d0c7;
    padding: 40px 20px; min-height: 100vh;
  }
  main { max-width: 640px; margin: 0 auto; }

  header {
    background: linear-gradient(135deg, #0F6E56 0%, #085041 100%);
    padding: 20px 24px; border-radius: 10px 10px 0 0;
    display: flex; align-items: center; gap: 12px;
  }
  .header-icon { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #e1f5ee; font-weight: 700; }
  header h1 { font-size: 17px; color: #e1f5ee; }
  header p { font-size: 12px; color: #9fe1cb; margin-top: 2px; }

  .panel { background: #14151a; border: 1px solid #1e1f23; border-top: none; border-radius: 0 0 10px 10px; padding: 24px; }
  .section { margin-bottom: 28px; }
  .section:last-child { margin-bottom: 0; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; color: #888780; margin-bottom: 12px; }

  label { display: block; margin-bottom: 16px; }
  label .lbl { display: block; font-size: 12px; color: #b4b2a9; margin-bottom: 6px; }
  label .hint { display: block; font-size: 11px; color: #5f5e5a; margin-top: 5px; }

  input[type=text], input[type=url], input[type=email], input[type=password] {
    width: 100%; background: #0e0f11; border: 1px solid #2a2b30;
    border-radius: 6px; padding: 9px 11px; color: #d1d0c7;
    font-size: 13px; font-family: inherit;
  }
  input:focus { outline: none; border-color: #0F6E56; }
  input[readonly] { color: #5f5e5a; font-family: monospace; font-size: 12px; }

  .toggle {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: #0e0f11; border: 1px solid #2a2b30; border-radius: 6px;
    cursor: pointer;
  }
  .toggle input { width: 16px; height: 16px; accent-color: #0F6E56; cursor: pointer; }
  .toggle-text strong { font-size: 13px; color: #d1d0c7; }
  .toggle-text span { display: block; font-size: 11px; color: #888780; margin-top: 2px; }

  .row { display: flex; gap: 10px; align-items: center; }
  .row input { flex: 1; }

  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #1e1f23; }

  .btn {
    background: #0F6E56; border: none; color: #e1f5ee; padding: 9px 18px;
    border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;
    transition: background 0.2s;
  }
  .btn:hover { background: #14856a; }
  .btn.secondary { background: transparent; border: 1px solid #2a2b30; color: #888780; }
  .btn.secondary:hover { border-color: #5f5e5a; color: #d1d0c7; background: transparent; }

  .status { font-size: 12px; color: #5f5e5a; }
  .status.ok { color: #5DCAA5; }
  .status.err { color: #E24B4A; }

  .queue-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 12px; color: #b4b2a9; }
  .queue-row span:last-child { color: #d1d0c7; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <header>
    <div class="header-icon">G</div>
    <div>
      <h1>LLM Guard — Configuration</h1>
      <p>Connexion au tableau de bord centralisé</p>
    </div>
  </header>

  <div class="panel">

    <div class="section">
      <div class="section-title">Envoi au tableau de bord</div>
      <label class="toggle">
        <input type="checkbox" id="opt-enabled">
        <div class="toggle-text">
          <strong>Activer l'envoi des métadonnées</strong>
          <span>Désactivé par défaut. Seules les métadonnées et les aperçus anonymisés ([EMAIL_1]…) sont envoyés.</span>
        </div>
      </label>
    </div>

    <div class="section">
      <div class="section-title">Backend</div>
      <label>
        <span class="lbl">URL du backend</span>
        <input type="url" id="opt-backend-url" placeholder="https://dashboard.example.com" autocomplete="off">
        <span class="hint">Endpoint HTTPS de votre instance auto-hébergée. Les évènements sont envoyés à <code>&lt;URL&gt;/v1/events</code>.</span>
      </label>
      <label>
        <span class="lbl">Jeton de l'appareil</span>
        <input type="password" id="opt-device-token" placeholder="Collez ici le jeton fourni par l'administrateur" autocomplete="off">
        <span class="hint">Bearer token généré depuis le tableau de bord (page Devices → Rotate token).</span>
      </label>
    </div>

    <div class="section">
      <div class="section-title">Organisation</div>
      <label>
        <span class="lbl">Org ID</span>
        <input type="text" id="opt-org-id" placeholder="acme" autocomplete="off">
        <span class="hint">Identifiant de l'organisation. Communiqué par l'administrateur.</span>
      </label>
      <label>
        <span class="lbl">Email utilisateur (optionnel)</span>
        <input type="email" id="opt-user-hint" placeholder="alice@acme.com" autocomplete="off">
        <span class="hint">Utilisé pour distinguer vos évènements dans le tableau de bord. Laissez vide pour rester anonyme.</span>
      </label>
    </div>

    <div class="section">
      <div class="section-title">Pièces jointes (PDF, images, texte)</div>
      <label class="toggle">
        <input type="checkbox" id="opt-attachment-enabled">
        <div class="toggle-text">
          <strong>Scanner les fichiers uploadés</strong>
          <span>Extrait le texte des PDF, images (OCR) et fichiers texte avant l'envoi au LLM. Appliqué automatiquement aux glisser-déposer et copier-coller.</span>
        </div>
      </label>
      <label>
        <span class="lbl">Comportement</span>
        <select id="opt-attachment-mode" style="width:100%;background:#0e0f11;border:1px solid #2a2b30;border-radius:6px;padding:9px 11px;color:#d1d0c7;font-size:13px">
          <option value="inherit">Hériter du mode global</option>
          <option value="block">Toujours bloquer si PII</option>
          <option value="warn">Toujours alerter (laisser passer)</option>
        </select>
        <span class="hint">En mode « hériter », Anonymiser/Bloquer globalement bloque l'upload et propose de copier le texte anonymisé à la place.</span>
      </label>
      <label>
        <span class="lbl">Types analysés</span>
        <div class="row" style="gap:14px">
          <label style="display:inline-flex;align-items:center;gap:6px;margin:0"><input type="checkbox" id="opt-attachment-pdf"> PDF</label>
          <label style="display:inline-flex;align-items:center;gap:6px;margin:0"><input type="checkbox" id="opt-attachment-image"> Images (OCR)</label>
          <label style="display:inline-flex;align-items:center;gap:6px;margin:0"><input type="checkbox" id="opt-attachment-text"> Fichiers texte</label>
        </div>
        <span class="hint">Les librairies PDF.js et Tesseract.js se chargent à la première utilisation (~2 MB + modèles de langue). Voir <code>vendor/</code>.</span>
      </label>
      <label>
        <span class="lbl">Taille maximum (Mo)</span>
        <input type="text" id="opt-attachment-max-mb" placeholder="20" inputmode="numeric" autocomplete="off">
        <span class="hint">Au-delà, le fichier est ignoré (enregistré comme <code>ATTACHMENT_UNSCANNED</code>).</span>
      </label>
    </div>

    <div class="section">
      <div class="section-title">Détection sémantique (Couche 4)</div>
      <label class="toggle">
        <input type="checkbox" id="opt-layer4-enabled">
        <div class="toggle-text">
          <strong>Activer la détection locale via Presidio</strong>
          <span>Appelle un microservice Presidio auto-hébergé pour détecter les noms, organisations et lieux non couverts par les regex. Aucune donnée ne sort de votre réseau.</span>
        </div>
      </label>
      <label>
        <span class="lbl">URL du service Presidio</span>
        <div class="row">
          <input type="url" id="opt-layer4-presidio-url" placeholder="http://presidio.internal:5001" autocomplete="off">
          <button class="btn secondary" id="btn-layer4-test" type="button">Tester</button>
        </div>
        <span class="hint">Le service doit répondre à <code>&lt;URL&gt;/health</code> et <code>&lt;URL&gt;/analyze</code>. Reste sur votre réseau.</span>
      </label>
      <div class="queue-row"><span>État Presidio</span><span id="layer4-status">—</span></div>
    </div>

    <div class="section">
      <div class="section-title">Identité de l'appareil</div>
      <label>
        <span class="lbl">Device ID (généré automatiquement)</span>
        <div class="row">
          <input type="text" id="opt-device-id" readonly>
          <button class="btn secondary" id="btn-regenerate" type="button">Régénérer</button>
        </div>
        <span class="hint">Identifiant persistant de cette installation. La régénération invalide les évènements historiques.</span>
      </label>
    </div>

    <div class="section">
      <div class="section-title">Synchronisation</div>
      <div class="queue-row"><span>Évènements en file</span><span id="q-count">0</span></div>
      <div class="queue-row"><span>Dernier envoi</span><span id="q-last">Jamais</span></div>
      <div class="queue-row"><span>Erreur</span><span id="q-err">—</span></div>
      <div class="row" style="margin-top: 12px;">
        <button class="btn" id="btn-flush" type="button">Forcer la synchronisation</button>
        <button class="btn secondary" id="btn-test" type="button">Tester la connexion</button>
      </div>
    </div>

    <div class="footer">
      <span class="status" id="save-status"></span>
      <button class="btn" id="btn-save" type="button">Enregistrer</button>
    </div>

  </div>
</main>

<script src="options.js"></script>
</body>
</html>
